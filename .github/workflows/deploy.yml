name: Build & Deploy Grant Tracker

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Twice daily (UTC) ≈ early morning and late afternoon Pacific.
    - cron: "0 14 * * *"
    - cron: "0 1 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node deps
        run: npm install --no-fund --no-audit --no-save docx@9.7.1

      - name: Fetch live data (curated + Grants.gov + ProPublica)
        run: python3 fetch_grants.py

      - name: Build calendar (.ics)
        run: python3 build_ics.py

      - name: Build Word summaries (.docx)
        run: node build_docs.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
